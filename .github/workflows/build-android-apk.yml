name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installable test APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pin npm version
        run: |
          npm install --global npm@11.6.2
          npm --version

      - name: Install JavaScript dependencies
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund --fetch-retries=5 --fetch-timeout=120000 --registry=https://registry.npmjs.org/ || {
            echo "::group::npm debug log"
            log_file="$(ls -t "$HOME"/.npm/_logs/*-debug-0.log 2>/dev/null | head -n 1)"
            if [ -n "$log_file" ]; then
              tail -n 120 "$log_file"
            else
              echo "npm debug log not found"
            fi
            echo "::endgroup::"
            exit 1
          }

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dailypulse-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
